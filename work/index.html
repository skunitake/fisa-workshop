<!doctype html>
<html lang="ja">
    <head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>AIカメラ</title>

    <link rel="stylesheet" href="index.css">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.5/dist/teachablemachine-image.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
    
    <body>
        <main class="wrap">
            <header>
                <h1>AIカメラ</h1>
                <p>自分で育てたAIを、カメラで試してみよう！</p>
            </header>
            <section class="panel">
                <h2><span class="step">1</span>AIモデルを選ぼう</h2>
                <label class="pick">Teachable MachineでダウンロードしたZIPファイルを選びます<input id="zipInput" type="file" accept=".zip,application/zip"></label>
                <p class="hint">「TensorFlow.js」形式でダウンロードした画像モデルに対応しています。</p>
                <div id="modelStatus" class="status" role="status">モデルを選ぶと読み込みます。</div>
            </section>
            <section class="panel">
                <h2><span class="step">2</span>カメラで試そう</h2>
                <div class="actions">
                    <button id="start" disabled>カメラを起動</button>
                    <button id="stop" class="secondary" disabled>カメラを止める</button>
                </div>
                <p class="hint">初回はブラウザからカメラの使用許可を求められます。「許可」を選びます。</p>
                <video id="video" autoplay muted playsinline hidden></video>
                <div id="result" class="result" hidden><span>AIがいちばん近いと思ったもの</span><strong id="topLabel">―</strong><span class="score" id="topScore"></span></div>
                <div id="bars" aria-live="off"></div><div id="cameraStatus" class="status" role="status">モデルを読み込んでからカメラを起動してね。</div>
            </section>
            <p class="foot">画像認識はこの端末のブラウザ内で行います。選んだモデルやカメラ画像を、このページからサーバーに送信する処理はありません。<br>
                AIの判定は間違うこともある。いろいろ試してみよう！</p>
        </main>

        <script src="index.js"></script>
    </body>
</html>
